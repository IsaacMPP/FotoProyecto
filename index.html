<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demi Tether Studio</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Demi Tether Studio</h1><span class="pill">Windows v0.5.0</span></header><main><aside><h2>Sesión</h2><p class="muted" id="folder">Cargando...</p><button id="choose">Elegir carpeta</button><h2>Conexión Canon USB</h2><button id="connect">Conectar Canon 6D Mark II</button><button id="disconnect" class="secondary">Desconectar cámara</button><h2>Proyección</h2><label for="displays">Televisor / monitor</label><select id="displays"></select><button id="open">Abrir visor a pantalla completa</button><button id="close" class="secondary">Cerrar visor</button><label class="toggle"><input type="checkbox" id="auto" checked> Mostrar última fotografía automáticamente</label><div class="alert" id="camera">USB mediante Canon EDSDK. Wi-Fi pendiente de validar.</div><p class="muted">Usa ← → / RePág AvPág o un presentador. Atajos globales: Alt + ← / → / Inicio.</p></aside><section class="gallery"><div class="toolbar"><strong id="counter">0 fotografías</strong><div><button id="prev" class="secondary">← Anterior</button><button id="latest" class="secondary">Última</button><button id="next" class="secondary">Siguiente →</button></div></div><div class="photo"><img id="preview" alt="Fotografía actual"><div id="empty">Añade fotografías JPG a la carpeta para comenzar</div></div><div id="file" class="muted filename"></div><div id="thumbs" class="thumbs"></div></section></main><script src="renderer.js"></script></body></html>
